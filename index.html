  body {
    font-family: "Microsoft YaHei", sans-serif;

    text-align: center;
    padding: 20px;
    margin: 0;
  }
  .container {
    position: relative;
    max-width: 500px;
    margin: auto;
    z-index: 1;
  }
  img {
    width: 100%;
    border-radius: 10px;
    display: block;
  }
  video.fullscreen {
    position: fixed;
    top: 50%;
    left: 50%;
    max-width: 100vw;
    max-height: 100vh;
    transform: translate(-50%, -50%);
    object-fit: contain; /* show full video without cutting off */
    z-index: 9999;
    background: black;
  }
  button {
    padding: 12px 25px;
    font-size: 18px;
    background: rgba(212,175,55,0.9);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    z-index: 2;
  }
  button:hover {
    background: rgba(193,154,46,0.9);
  }
  #drawBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  #result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    background: rgba(255,255,255,0.85);
    border: 1px solid #ddd;
    display: none;
    white-space: pre-line;
    text-align: left;
    position: relative;
    z-index: 10000; /* above video */
  }
  #retryBtn {
    display: block;
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 16px;
    background: rgba(70,130,180,0.9);
    border-radius: 6px;

  #retryBtn:hover {

</style>

function resetPage() {
  // Remove videos
  document.querySelectorAll("video.fullscreen").forEach(v => v.remove());
  // Hide result
  document.getElementById('result').style.display = 'none';
  // Restore image + draw button
  document.getElementById('lotImage').style.display = 'block';
  document.getElementById('drawBtn').style.display = 'block';
}

document.getElementById('drawBtn').addEventListener('click', function() {
  const lot = lots[Math.floor(Math.random() * lots.length)];
  const resultText = `签号：${lot.num}\n签级：${lot.grade}\n签诗：${lot.poem}\n解签：${lot.meaning}`;
  
  // Hide image + button
  document.getElementById('lotImage').style.display = 'none';
  document.getElementById('drawBtn').style.display = 'none';
  document.getElementById('result').style.display = 'none';

  // Remove any old videos
  document.querySelectorAll("video.fullscreen").forEach(v => v.remove());

  // Play first animation
  const firstVideo = document.createElement('video');
  firstVideo.className = "fullscreen";
  firstVideo.autoplay = true;
  firstVideo.muted = true;
  firstVideo.playsInline = true;
  firstVideo.innerHTML = `
    <source src="https://raw.githubusercontent.com/usa185868-stack/beidi-lingqian/main/lv_0_20250902133004.mp4" type="video/mp4">
  `;
  document.body.appendChild(firstVideo);

  // When first ends → play second
  firstVideo.onended = function() {
    firstVideo.remove();

    const secondVideo = document.createElement('video');
    secondVideo.className = "fullscreen";
    secondVideo.autoplay = true;
    secondVideo.muted = true;
    secondVideo.playsInline = true;
    secondVideo.innerHTML = `
      <source src="https://raw.githubusercontent.com/usa185868-stack/beidi-lingqian/main/lv_0_20250902133102.mp4" type="video/mp4">
    `;
    document.body.appendChild(secondVideo);

    // Show fortune when second finishes
    secondVideo.onended = function() {
      secondVideo.pause();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = resultText + 
        `<button id="retryBtn">再抽一次</button>`;
      resultDiv.style.display = 'block';

      // Add event for retry
      document.getElementById('retryBtn').onclick = resetPage;
    };
  };
});
</script>

</html>
