<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>北帝灵签抽签</title>
<style>
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #ffffff;
    text-align: center;
    padding: 20px;
  }
  .container {
    position: relative;
    max-width: 500px;
    margin: auto;
  }
  img, video {
    width: 100%;
    border-radius: 10px;
    display: block;
  }
  button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 25px;
    font-size: 18px;
    background: rgba(212,175,55,0.9);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    z-index: 2;
  }
  button:hover {
    background: rgba(193,154,46,0.9);
  }
  #result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    background: #fafafa;
    border: 1px solid #ddd;
    display: none;
    white-space: pre-line;
    text-align: left;
  }
</style>
</head>
<body>

<h2>北帝灵签抽签</h2>
<div class="container">
  <!-- Default static image before clicking -->
  <img id="lotImage" src="https://raw.githubusercontent.com/usa185868-stack/beidi-lingqian/main/1755698895781.png" alt="抽签图">
  <button id="drawBtn">抽签</button>
</div>

<div id="result"></div>

  {num: 23, grade: "中吉", poem: "石中藏玉人未知 時來必定價連城", meaning: "潛藏才華，終能顯現"},

  {num: 27, grade: "下下", poem: "火燒草原風助勢 損失難免宜謹防", meaning: "小心防範，免遭禍害"},

  {num: 29, grade: "中吉", poem: "三更月色映江流 行舟此夜自無憂", meaning: "平安順利，無大阻礙"},

  {num: 45, grade: "下下", poem: "危樓高築風雨催 須防倒塌免受災", meaning: "凡事謹慎，切勿驕矜"},
  {num: 46, grade: "上吉", poem: "祥雲瑞氣滿門庭 福星高照保安寧", meaning: "吉祥如意，家宅安泰"},
  {num: 47, grade: "中吉", poem: "千里姻緣一線牽 良緣美滿喜團圓", meaning: "婚姻順遂，喜事臨門"},
  {num: 48, grade: "下下", poem: "風雨飄搖舟難定 暫守靜處免災星", meaning: "小心謹慎，靜待時機"},
  {num: 49, grade: "上吉", poem: "金玉滿堂財源廣 喜氣洋洋福祿昌", meaning: "財運亨通，富貴榮華"},
  {num: 50, grade: "中吉", poem: "勤耕苦作有收成 莫怕辛勞事自成", meaning: "付出努力，終見成果"},
  {num: 51, grade: "上吉", poem: "千重浪後見清波 事業有望財源廣", meaning: "障礙過後，一切順利"}

document.getElementById('drawBtn').addEventListener('click', function() {
  const lot = lots[Math.floor(Math.random() * lots.length)];
  const resultText = `签号：${lot.num}\n签级：${lot.grade}\n签诗：${lot.poem}\n解签：${lot.meaning}`;
  document.getElementById('result').textContent = resultText;
  document.getElementById('result').style.display = 'block';
  
  // Hide static image
  document.getElementById('lotImage').style.display = 'none';

  // --- First animation ---
  let firstAnim = document.getElementById('firstAnim');
  if (!firstAnim) {
    const container = document.querySelector('.container');
    firstAnim = document.createElement('video');
    firstAnim.id = 'firstAnim';
    firstAnim.width = "100%";
    firstAnim.muted = true;
    firstAnim.autoplay = true;
    firstAnim.style.borderRadius = "10px";
    firstAnim.innerHTML = `
      <source src="https://raw.githubusercontent.com/usa185868-stack/beidi-lingqian/main/lv_0_20250902133004.mp4" type="video/mp4">
      您的浏览器不支持视频播放。
    `;
    container.insertBefore(firstAnim, document.getElementById('drawBtn'));
  } else {
    firstAnim.style.display = 'block';
    firstAnim.play();
  }

  // --- After 6s, switch to looping result animation ---
  setTimeout(function() {
    firstAnim.style.display = 'none';

    const container = document.querySelector('.container');
    let resultAnim = document.getElementById('resultAnim');
    if (!resultAnim) {
      resultAnim = document.createElement('video');
      resultAnim.id = 'resultAnim';
      resultAnim.width = "100%";
      resultAnim.muted = true;
      resultAnim.autoplay = true;
      resultAnim.loop = true; // keep looping
      resultAnim.style.borderRadius = "10px";
      resultAnim.innerHTML = `
        <source src="https://raw.githubusercontent.com/usa185868-stack/beidi-lingqian/main/lv_0_20250902133102.mp4" type="video/mp4">
        您的浏览器不支持视频播放。
      `;
      container.insertBefore(resultAnim, document.getElementById('drawBtn'));
    } else {
      resultAnim.style.display = 'block';
      resultAnim.play();
    }
  }, 6000);
});
</script>

</body>
</html>
